# yaml-language-server: $schema=https://raw.githubusercontent.com/sanger-tol/nf-core-modules/main/modules/meta-schema.json
name: "segmentquantized"
description: Final three-class segmentation (putative_core, putative_GRS, uncertain) of canonical chromosomes from base-resolution quantized depth, anchored by clustered DELFIES breakpoints; non-canonical scaffolds keep the IDENTIFYPUTATIVEGRS call.
keywords:
  - pde
  - grs
  - core
  - gaps
  - mosdepth
tools:
  - python:
      description: Python interpreter running pde_segment_quantized.py
      homepage: https://www.python.org/
      licence:
        - "PSF-2.0"
      identifier: biotools:python
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information e.g. [ id:'test' ]
    - summary_tsv:
        type: file
        description: grs_summary.tsv from IDENTIFYPUTATIVEGRS
        pattern: "*.final.grs_summary.tsv"
  - - meta2:
        type: map
        description: Groovy Map containing sample information
    - quantized_bed:
        type: file
        description: Quantized mosdepth coverage runs from MOSDEPTHQUANTIZE
        pattern: "*.quantized.red_masked.bed"
  - - meta3:
        type: map
        description: Groovy Map containing sample information
    - gaps_bed:
        type: file
        description: Assembly N-gap intervals from GFASTATSGAPS
        pattern: "*.gaps.bed"
  - - meta4:
        type: map
        description: Groovy Map containing sample information
    - red_bed:
        type: file
        description: RED repeat intervals
        pattern: "*.bed"
  - - meta5:
        type: map
        description: Groovy Map containing sample information
    - regions_bed:
        type: file
        description: Mosdepth windows used by IDENTIFYPUTATIVEGRS (median depth)
        pattern: "*.bed.gz"
  - - meta6:
        type: map
        description: Groovy Map containing sample information
    - breakpoints_tsv:
        type: file
        description: Clustered DELFIES breakpoints from IDENTIFYPUTATIVEGRS
        pattern: "*.delfies_breakpoints.tsv"
output:
  - bed:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.pde_segments.bed":
          type: file
          description: Final three-class segments, 4 columns
          pattern: "*.pde_segments.bed"
  - summary:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.final.grs_summary.tsv":
          type: file
          description: Summary table with ELIMINATION_RANGE including canon_uncertain_bp
          pattern: "*.final.grs_summary.tsv"
  - versions_python:
      - - ${task.process}:
            type: string
            description: The process the versions were collected from
        - python:
            type: string
            description: The tool name
        - eval("python3 --version"):
            type: string
            description: The tool version
authors:
  - "@pg17"
