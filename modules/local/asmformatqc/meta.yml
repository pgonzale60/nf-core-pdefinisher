# yaml-language-server: $schema=https://raw.githubusercontent.com/sanger-tol/nf-core-modules/main/modules/meta-schema.json
name: "asmformatqc"
description: |
  Validate an AGP file with agp-tpf-utils `asm-format`, checking component
  overlaps and emitting a corrected AGP before it is used to synthesise a
  curated assembly.
keywords:
  - agp
  - assembly
  - curation
  - qc
  - validation
tools:
  - agp-tpf-utils:
      description: |
        Utilities for Tree of Life AGP and TPF assembly files. This module runs
        `asm-format --qc-overlaps` to validate an AGP and write a corrected copy.
      homepage: https://github.com/sanger-tol/agp-tpf-utils
      documentation: https://github.com/sanger-tol/agp-tpf-utils
      tool_dev_url: https://github.com/sanger-tol/agp-tpf-utils
      licence:
        - "MIT"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - agp:
        type: file
        description: AGP file describing the assembly to validate
        pattern: "*.agp"
        ontologies:
          - edam: "http://edamontology.org/format_3693" # AGP
output:
  agp:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.validated.agp":
          type: file
          description: AGP file that passed overlap quality control
          pattern: "*.validated.agp"
          ontologies:
            - edam: "http://edamontology.org/format_3693" # AGP
  versions_agp_tpf_utils:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - agp-tpf-utils:
          type: string
          description: The tool name
      - "1.3.4":
          type: string
          description: The version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - agp-tpf-utils:
          type: string
          description: The tool name
      - "1.3.4":
          type: string
          description: The version of the tool
authors:
  - "@pgonzale60"
maintainers:
  - "@pgonzale60"
