# yaml-language-server: $schema=https://raw.githubusercontent.com/sanger-tol/nf-core-modules/main/subworkflows/yaml-schema.json
name: "curation_validation"
description: |
  Post-curation validation subworkflow that maps long reads against the post-surgery
  curated assembly, calls structural variants with Sniffles, and verifies surgical
  locus concordance and flagrant assembly defects.
keywords:
  - pde
  - validation
  - structural-variants
  - sniffles
  - minimap2
components:
  - minimap2/align
  - sniffles
  - curationvalidation
input:
  - ch_reads:
      type: file
      description: |
        Long reads (BAM or FASTQ) to map against the curated reference.
        Structure: [ val(meta), path(reads) ]
      pattern: "*.{bam,fastq,fq,fastq.gz,fq.gz}"
  - ch_curated_fa:
      type: file
      description: |
        Post-surgery curated assembly in FASTA format.
        Structure: [ val(meta), path(curated_fasta) ]
      pattern: "*.{fa,fasta,fna}"
  - ch_curated_agp:
      type: file
      description: |
        Curated AGP v2.1 file produced by assembly surgery.
        Structure: [ val(meta), path(curated_agp) ]
      pattern: "*.curated.agp"
  - ch_curation_audit:
      type: file
      description: |
        Tab-separated audit of every surgical edit applied during curation.
        Structure: [ val(meta), path(curation_audit_tsv) ]
      pattern: "*.curation_audit.tsv"
output:
  - curated_bam:
      type: file
      description: |
        HiFi reads mapped to the curated assembly.
        Structure: [ val(meta), path(bam) ]
      pattern: "*.bam"
  - curated_bai:
      type: file
      description: |
        Index file for the curated alignment BAM.
        Structure: [ val(meta), path(bai) ]
      pattern: "*.bam.bai"
  - sniffles_vcf:
      type: file
      description: |
        Sniffles VCF of structural variants called against the curated assembly.
        Structure: [ val(meta), path(vcf) ]
      pattern: "*.vcf.gz"
  - sniffles_tbi:
      type: file
      description: |
        Index file for the Sniffles VCF.
        Structure: [ val(meta), path(tbi) ]
      pattern: "*.vcf.gz.tbi"
  - validation_json:
      type: file
      description: |
        Structured validation metrics JSON.
        Structure: [ val(meta), path(json) ]
      pattern: "*.curation_validation.json"
  - validation_md:
      type: file
      description: |
        Executive Markdown validation dossier.
        Structure: [ val(meta), path(md) ]
      pattern: "*.curation_validation.md"
  - versions:
      type: file
      description: |
        File containing software versions.
        Structure: [ path(versions) ]
      pattern: "versions.yml"
authors:
  - "@pgonzale60"
